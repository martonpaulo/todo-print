name: Deploy

on:
  # Deploy never revalidates: it waits for Validate to pass on the default
  # branch and publishes that commit.
  workflow_run:
    workflows: [Validate]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    outputs:
      deploy_needed: ${{ steps.changed.outputs.deploy_needed }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The commit Validate approved; empty (the default branch) for a manual dispatch.
          ref: ${{ github.event.workflow_run.head_sha }}
          # Enough history for the change filter below to read the parent commit.
          fetch-depth: 2
      # Does this push change anything the build reads? The set below is derived from the build,
      # not from file extensions: vite.config.ts and tsconfig.app.json resolve the application from
      # index.html, src/ and public/; the package files fix its dependencies; the tsconfig and
      # vite files shape the output; this workflow decides how it is built. AGENTS.md, README.md,
      # docs/, .ao/, .gemini/ and the validation workflow are outside it because nothing in
      # `tsc -b && vite build` reads them. An unknowable changed set (first push, force-push,
      # workflow_dispatch) deploys.
      - name: Decide whether the deploy is needed
        id: changed
        env:
          BEFORE: ${{ (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push') && format('{0}^', github.event.workflow_run.head_sha) || '' }}
          AFTER: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -u
          needed=true
          if [ -n "$BEFORE" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            changed=$(git diff --name-only "$BEFORE" "$AFTER")
            if [ -n "$changed" ] && ! printf '%s\n' "$changed" | grep -Eq \
                '^(index\.html|src/|public/|package\.json|package-lock\.json|vite\.config\.ts|tsconfig(\.app|\.node)?\.json|\.github/workflows/deploy\.yml)'; then
              needed=false
            fi
            printf 'changed files:\n%s\n' "$changed"
          fi
          echo "deploy_needed=$needed" >> "$GITHUB_OUTPUT"
          echo "deploy needed: $needed"
      - name: Set up Node
        if: steps.changed.outputs.deploy_needed == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        if: steps.changed.outputs.deploy_needed == 'true'
        run: npm ci
      # Only the build. The lint and the two suites belong to Validate and are not repeated;
      # `actions/deploy-pages` can only read an artifact uploaded in its own run, which is why
      # `dist/` is produced here.
      - name: Build
        if: steps.changed.outputs.deploy_needed == 'true'
        run: npm run build
      - name: Configure Pages
        if: steps.changed.outputs.deploy_needed == 'true'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Upload Pages artifact
        if: steps.changed.outputs.deploy_needed == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: ./dist

  deploy:
    needs: build
    if: needs.build.outputs.deploy_needed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
