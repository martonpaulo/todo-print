name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      # `setup-node`'s `cache: npm` covers the npm cache only. Puppeteer's Chrome lives in
      # ~/.cache/puppeteer, and npm 11 skips lifecycle scripts by default, so Puppeteer's postinstall
      # never provisions it; tests/print-geometry/geometry.test.ts falls back to
      # `npx puppeteer browsers install chrome` on first launch and populates exactly this path.
      # The key covers both files that can move the pinned build: package-lock.json fixes the resolved
      # Puppeteer version, and .puppeteerrc.cjs overrides the Chrome revision that version carries.
      # Either one changing has to miss. The lockfile alone stopped being sufficient in #45, which
      # added the override. No restore-keys: a partial hit would supply a Chrome for a different
      # build, which fails at launch instead of falling through to a download.
      - name: Cache Puppeteer browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/puppeteer
          key: puppeteer-${{ runner.os }}-${{ hashFiles('package-lock.json', '.puppeteerrc.cjs') }}
      # One step, running the same `check` a developer runs locally: lint, the browser-free suite,
      # the printed-page geometry check and the build. Kept as a single step on purpose -- three
      # separate steps let CI's definition of "validated" drift away from package.json's, which is
      # how the geometry check came to run nowhere in CI (#26).
      - name: Check
        run: npm run check
