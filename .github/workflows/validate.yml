name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # `setup-node`'s `cache: pnpm` covers the pnpm store only. Puppeteer's Chrome lives in
      # ~/.cache/puppeteer, and pnpm does not run dependency install scripts by default, so
      # Puppeteer's postinstall never provisions it; tests/print-geometry/geometry.test.ts falls
      # back to `pnpm exec puppeteer browsers install chrome` on first launch and populates exactly
      # that path.
      # The key covers both files that can move the pinned build: pnpm-lock.yaml fixes the resolved
      # Puppeteer version, and .puppeteerrc.cjs overrides the Chrome revision that version carries.
      # Either one changing has to miss. The lockfile alone stopped being sufficient in #45, which
      # added the override. No restore-keys: a partial hit would supply a Chrome for a different
      # build, which fails at launch instead of falling through to a download.
      - name: Cache Puppeteer browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/puppeteer
          key: puppeteer-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', '.puppeteerrc.cjs') }}
      # One step, running the same `check` a developer runs locally: lint, the browser-free suite,
      # the printed-page geometry check and the build. Kept as a single step on purpose -- three
      # separate steps let CI's definition of "validated" drift away from package.json's, which is
      # how the geometry check came to run nowhere in CI (#26).
      - name: Check
        run: pnpm check
